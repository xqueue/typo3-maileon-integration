name: CI

on:
  push:
  pull_request:

jobs:
  cgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer install --no-progress
      - run: composer lint-cs
      - run: composer lint-stan

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            typo3: '^12.4'
          - php: '8.2'
            typo3: '^13.4'
          - php: '8.3'
            typo3: '^14.3'
          - php: '8.4'
            typo3: '^14.3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, curl, dom, json, libxml, simplexml
          tools: composer:v2
      # saschaegerer/phpstan-typo3 ^3.1 (require-dev) only supports typo3/cms-core ^14.0,
      # so it conflicts with the ^12.4/^13.4 legs below; static analysis is covered by
      # the cgl job on a fixed TYPO3 version, so it's not needed here.
      - run: composer remove --dev --no-update saschaegerer/phpstan-typo3
      - run: composer require --no-update typo3/cms-core:${{ matrix.typo3 }} typo3/cms-form:${{ matrix.typo3 }}
      - run: composer install --no-progress
      - run: composer test-unit
      - run: composer test-functional
        env:
          typo3DatabaseDriver: pdo_sqlite
